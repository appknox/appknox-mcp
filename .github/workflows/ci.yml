name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # Runs the exact hooks in .pre-commit-config.yaml (black, ruff, mypy,
      # plus the hygiene checks) — a pre-commit hook is opt-in locally and
      # skippable with --no-verify, so this is what actually enforces it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit hooks
        run: uv run --with pre-commit pre-commit run --all-files --show-diff-on-failure

  # Single required status check for branch protection, instead of naming
  # `test`/`lint` individually there — this succeeds only if every job in the
  # workflow did, so adding a new job here later doesn't also require a
  # branch-protection settings change to actually gate merges on it.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::One or more required CI jobs failed (test=${{ needs.test.result }}, lint=${{ needs.lint.result }})."
            exit 1
          fi
