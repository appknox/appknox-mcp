name: Build & Release Wheel

# Manual trigger for now. Run from the Actions tab (or `gh workflow run
# release.yml`). It tests, builds the wheel + sdist, smoke-tests the BUILT wheel
# (not the source tree), then creates a GitHub Release with the artifacts
# attached — so you can `uv tool install <release-wheel-url>` and test the real
# install path.
#
# Publishing to TestPyPI/PyPI is a SEPARATE workflow (publish.yml) that only
# fires once the release created here is actually published — see that file
# for the one-time Trusted Publishing setup it needs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Defaults to v<version from pyproject>."
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: true

# Needed for the built-in GITHUB_TOKEN to create a release + tag.
permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      # Dummy token so importing the server / running tests never blocks on auth.
      # Not a credential — the server accepts an empty/placeholder token and only
      # fails on an actual API call, which this workflow never makes.
      APPKNOX_ACCESS_TOKEN: "PLACEHOLDER:PLACEHOLDER"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: uv run pytest -q

      - name: Build wheel + sdist
        run: uv build

      - name: Smoke-test the built wheel (import + tool count) in a clean venv
        run: |
          uv venv /tmp/verify
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          # Run from /tmp so a source-relative file (e.g. the repo's docs/) can't
          # mask a packaging bug — this is exactly what caught the spec-load crash.
          cd /tmp
          /tmp/verify/bin/python -c "import asyncio, appknox_mcp.server as s; n=len(asyncio.run(s.mcp.list_tools())); print(f'built wheel OK — {n} tools'); assert n >= 7, n"

      - name: Resolve release tag
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            TAG="v$VER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=(--title "$TAG" --generate-notes --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          # Fail clearly if the tag already has a release (manual reruns).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version or pass a new tag."
            exit 1
          fi
          gh release create "$TAG" dist/*.whl dist/*.tar.gz "${FLAGS[@]}"
          echo "Wheel install URL:"
          gh release view "$TAG" --json assets --jq '.assets[] | select(.name|endswith(".whl")) | .url'
