name: Build, Attach & Publish Release

# Fires when a GitHub Release is published — created by YOU (GitHub UI's
# "Draft a new release", or `gh release create <tag>` from your own login),
# never by this workflow itself. That distinction matters: GitHub's
# anti-recursion guard blocks an event created by a workflow's own
# GITHUB_TOKEN from triggering other workflows, so a release this workflow
# created would never actually fire `release: published` — which is exactly
# why release creation now has to be a human action, not automated. In
# exchange, you get full control: pick any tag (new or existing) and any
# branch/commit as the release's target, from GitHub's own release UI.
#
# Verifies pyproject.toml's version at that exact commit matches the tag you
# chose (a mismatch almost always means you forgot to bump the version before
# tagging), then tests, builds the wheel + sdist, smoke-tests the BUILT wheel,
# attaches both to the release you created, and publishes:
#   - "Set as a pre-release" checked  -> TestPyPI (safe, repeatable dry run)
#   - unchecked (a real release)      -> PyPI
#
# Requires one-time setup on both index's side before this can succeed —
# nothing here works until you do this by hand (PyPI Trusted Publishing has no
# API for it):
#   1. On test.pypi.org and pypi.org, under your account -> Publishing, add a
#      "pending" trusted publisher for this project:
#        - PyPI project name: appknox-mcp
#        - Owner: appknox   Repository: appknox-mcp
#        - Workflow filename: publish.yml
#        - Environment name: testpypi (on test.pypi.org) / pypi (on pypi.org)
#   2. In this repo's Settings -> Environments, create two environments named
#      "testpypi" and "pypi" (the names must match what you registered above).
#      Optionally add required reviewers to the "pypi" environment for a manual
#      gate on real publishes.
# No secrets to create or store — Trusted Publishing uses this job's own OIDC
# token (the `id-token: write` permission below), which is why the workflow
# filename and environment name both have to match exactly what you registered.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Has to be resolved here, not inside a step — environment protection
    # rules are evaluated before the job's steps run. github.event.release is
    # available directly since this triggers on the release event itself —
    # no separate lookup job needed (unlike when we reacted to a workflow_run).
    environment: ${{ github.event.release.prerelease && 'testpypi' || 'pypi' }}
    permissions:
      contents: write # to attach the wheel/sdist to the release you created
      id-token: write # PyPI/TestPyPI Trusted Publishing (OIDC)
    env:
      # Dummy token so importing the server / running tests never blocks on
      # auth. Not a credential — the server accepts an empty/placeholder
      # token and only fails on an actual API call, which this never makes.
      APPKNOX_ACCESS_TOKEN: "PLACEHOLDER:PLACEHOLDER"
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly what you tagged, not whatever the default branch's
          # HEAD happens to be.
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Verify pyproject.toml's version matches the release tag
        run: |
          EXPECTED="v$(uv version --short)"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Release tag '$TAG' doesn't match pyproject.toml's version"\
              "('$EXPECTED' at this commit). Bump the version to match before"\
              "tagging, or delete this release and re-tag."
            exit 1
          fi

      - name: Run tests
        run: uv run pytest -q

      - name: Build wheel + sdist
        run: uv build

      - name: Smoke-test the built wheel (import + tool count) in a clean venv
        run: |
          uv venv /tmp/verify
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          # Run from /tmp so a source-relative file (e.g. the repo's docs/) can't
          # mask a packaging bug — this is exactly what caught the spec-load crash.
          cd /tmp
          /tmp/verify/bin/python -c "import asyncio, appknox_mcp.server as s; n=len(asyncio.run(s.mcp.list_tools())); print(f'built wheel OK — {n} tools'); assert n >= 7, n"

      - name: Attach wheel + sdist to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl dist/*.tar.gz --clobber

      - name: Publish to TestPyPI (prerelease dry run)
        if: github.event.release.prerelease
        run: uv publish --index testpypi

      - name: Publish to PyPI
        if: ${{ !github.event.release.prerelease }}
        run: uv publish

      - name: Summary
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "### Published to TestPyPI :test_tube:" >> "$GITHUB_STEP_SUMMARY"
            echo "Verify with: \`uv tool install --reinstall --index https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ --index-strategy unsafe-best-match appknox-mcp\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published to PyPI :rocket:" >> "$GITHUB_STEP_SUMMARY"
            echo "Verify with: \`uv tool install --reinstall appknox-mcp\`" >> "$GITHUB_STEP_SUMMARY"
          fi
