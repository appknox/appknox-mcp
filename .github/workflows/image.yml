name: Container image

# Publishes ghcr.io/appknox/appknox-mcp, the image the remote (hosted) MCP
# server runs from (staging-fluxcd: sherlock chart, `mcp.enabled: true`).
#
#   - Pull request (opened / new commits): tag `<head-branch>_<short-sha>`,
#     so any PR can be deployed to a sherlock instance before it merges.
#     Same-repo PRs only (fork PRs get no packages:write token).
#   - Manual run (Actions -> Container image -> Run workflow, pick a branch):
#     tag `<branch>_<short-sha>` — the same convention as appknox/staging's
#     images. (GitHub only offers this once the workflow is on develop.)
#   - Published GitHub Release (same event publish.yml uses): tags `<version>`
#     (pyproject.toml, without the leading v) and `latest`.
#
# The image contains no credentials; it needs only `packages: write` on this
# repo's own GITHUB_TOKEN to push.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Fork PRs can't push packages; skip them instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # On PRs, build the PR's head commit (the one the tag names), not
          # GitHub's merge-preview commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Compute tags
        id: tags
        # Untrusted strings (branch / tag names) come in via env, never
        # interpolated into the script itself.
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          IMAGE=ghcr.io/appknox/appknox-mcp
          if [ "$EVENT" = "release" ]; then
            VERSION="${RELEASE_TAG#v}"
            echo "tags=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            BRANCH="$(printf '%s' "$REF_NAME" | tr '/' '-' | tr -cd '[:alnum:]._-')"
            echo "tags=$IMAGE:${BRANCH}_${COMMIT::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          TAG="${TAGS%%,*}"
          docker run -d --name mcp -p 8000:8000 \
            -e APPKNOX_API_BASE_URL=https://api.appknox.com \
            -e APPKNOX_MCP_PUBLIC_URL=http://127.0.0.1:8000 \
            "$TAG" --http --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs mcp
          exit 1
