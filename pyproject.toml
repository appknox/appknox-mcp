[project]
name = "appknox-mcp"
version = "0.1.1"
description = "MCP server for the Appknox mobile app security platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Appknox" }]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
appknox-mcp = "appknox_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Publish target for the dry-run pipeline (.github/workflows/publish.yml).
# `explicit = true` keeps it out of normal dependency resolution — `uv sync` never
# looks here — it's only used when a command names it via `--index testpypi`.
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
