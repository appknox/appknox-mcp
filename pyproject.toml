[project]
name = "appknox-mcp"
version = "1.0.2"
description = "MCP server for the Appknox mobile app security platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Appknox" }]
dependencies = [
    # Pinned exactly to the version this project is tested against. uv.lock
    # is gitignored on purpose and `uv tool install` / the Docker image
    # resolve fresh every time, so a range let installs drift silently:
    # 4.x broke real MCP clients ("Invalid request parameters" on every call
    # after an install jumped 3.4.6 -> 4.0.3), and the remote mode relies on
    # 3.x APIs (local_provider, custom routes, host-origin protection). Bump
    # deliberately, after re-running the tests and an end-to-end check.
    "fastmcp==3.4.6",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
appknox-mcp = "appknox_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=3.0.0",
    "ruff>=0.16.0",
    "black>=25.0.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Bundle INSTALL.md, plus the Claude Code plugin marketplace (.claude-plugin/)
# and the plugin itself (plugins/appknox/), into the wheel so both are usable
# after `uv tool install`/`pip install` with no repo clone or GitHub access:
#  - `appknox-mcp --install-guide` prints INSTALL.md (see server.py).
#  - `appknox-mcp --install-claude-plugin` extracts the bundled plugin files
#    to a stable local directory and registers them with `claude plugin
#    marketplace add <that path>` — the local-path form, which needs no git
#    clone, sidestepping Claude Code's private-repo clone limitation entirely
#    (see server.py's `_install_claude_plugin`).
# Single source of truth: this repo's own top-level copies, just relocated
# inside the package at build time.
[tool.hatch.build.targets.wheel.force-include]
"INSTALL.md" = "appknox_mcp/INSTALL.md"
".claude-plugin" = "appknox_mcp/claude_plugin/.claude-plugin"
"plugins" = "appknox_mcp/claude_plugin/plugins"
